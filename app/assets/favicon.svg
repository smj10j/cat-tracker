<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1128"/>
      <stop offset="100%" stop-color="#16111f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Cat face, simplified for small size -->
  <g transform="translate(16, 15.5)">
    <!-- Ears -->
    <polygon points="-6.5,-5.5 -5,-11 -2.5,-6" fill="#c084fc"/>
    <polygon points="6.5,-5.5 5,-11 2.5,-6" fill="#c084fc"/>

    <!-- Head -->
    <ellipse cx="0" cy="0" rx="7" ry="6.2" fill="#c084fc"/>

    <!-- Eyes -->
    <ellipse cx="-2.5" cy="-1" rx="1.5" ry="1.7" fill="#16111f"/>
    <ellipse cx="2.5" cy="-1" rx="1.5" ry="1.7" fill="#16111f"/>

    <!-- Nose -->
    <path d="M0,1.5 L-0.7,2.5 Q0,3 0.7,2.5 Z" fill="#e8b4f8"/>

    <!-- Whiskers — simplified, 2 per side -->
    <line x1="-3.5" y1="2" x2="-10" y2="0.5" stroke="white" stroke-width="0.7" stroke-linecap="round" opacity="0.9"/>
    <line x1="-3.5" y1="2.8" x2="-10" y2="4" stroke="white" stroke-width="0.7" stroke-linecap="round" opacity="0.9"/>
    <line x1="3.5" y1="2" x2="10" y2="0.5" stroke="white" stroke-width="0.7" stroke-linecap="round" opacity="0.9"/>
    <line x1="3.5" y1="2.8" x2="10" y2="4" stroke="white" stroke-width="0.7" stroke-linecap="round" opacity="0.9"/>

    <!-- Tiny health heart -->
    <circle cx="5" cy="4.5" r="1.2" fill="#4ade80" opacity="0.85"/>
  </g>
</svg>
