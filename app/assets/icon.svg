<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1128"/>
      <stop offset="100%" stop-color="#16111f"/>
    </linearGradient>
    <!-- Subtle inner glow -->
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0%" stop-color="#2a1f3d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#16111f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>

  <!-- Cat face group, centered -->
  <g transform="translate(512, 480)">

    <!-- Left ear -->
    <polygon points="-200,-180 -160,-340 -80,-200" fill="#c084fc" opacity="0.9"/>
    <!-- Right ear -->
    <polygon points="200,-180 160,-340 80,-200" fill="#c084fc" opacity="0.9"/>

    <!-- Inner left ear -->
    <polygon points="-175,-195 -155,-305 -100,-210" fill="#9b5de5" opacity="0.6"/>
    <!-- Inner right ear -->
    <polygon points="175,-195 155,-305 100,-210" fill="#9b5de5" opacity="0.6"/>

    <!-- Head shape — rounded ellipse -->
    <ellipse cx="0" cy="0" rx="210" ry="190" fill="#c084fc"/>

    <!-- Left eye -->
    <ellipse cx="-75" cy="-30" rx="38" ry="42" fill="#16111f"/>
    <!-- Left eye pupil slit -->
    <ellipse cx="-75" cy="-30" rx="12" ry="36" fill="#2a1f3d"/>
    <!-- Left eye shine -->
    <circle cx="-62" cy="-45" r="8" fill="white" opacity="0.8"/>

    <!-- Right eye -->
    <ellipse cx="75" cy="-30" rx="38" ry="42" fill="#16111f"/>
    <!-- Right eye pupil slit -->
    <ellipse cx="75" cy="-30" rx="12" ry="36" fill="#2a1f3d"/>
    <!-- Right eye shine -->
    <circle cx="88" cy="-45" r="8" fill="white" opacity="0.8"/>

    <!-- Nose -->
    <polygon points="0,50 -18,75 18,75" fill="#9b5de5" rx="4"/>
    <!-- Nose rounded version -->
    <path d="M0,48 L-16,72 Q0,82 16,72 Z" fill="#e8b4f8"/>

    <!-- Mouth lines -->
    <path d="M0,72 Q-20,95 -35,88" fill="none" stroke="#9b5de5" stroke-width="4" stroke-linecap="round"/>
    <path d="M0,72 Q20,95 35,88" fill="none" stroke="#9b5de5" stroke-width="4" stroke-linecap="round"/>

    <!-- WHISKERS — prominent and bold -->
    <!-- Left whiskers -->
    <line x1="-90" y1="60" x2="-310" y2="20" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
    <line x1="-90" y1="75" x2="-320" y2="75" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
    <line x1="-90" y1="90" x2="-310" y2="130" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.95"/>

    <!-- Right whiskers -->
    <line x1="90" y1="60" x2="310" y2="20" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
    <line x1="90" y1="75" x2="320" y2="75" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
    <line x1="90" y1="90" x2="310" y2="130" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.95"/>

    <!-- Small health heart in jade green — bottom right of face -->
    <path d="M140,140
             C140,130 155,118 165,130
             C175,118 190,130 190,140
             C190,158 165,172 165,172
             C165,172 140,158 140,140 Z"
          fill="#4ade80" opacity="0.9"/>

    <!-- Tiny plus/cross inside heart for health -->
    <line x1="165" y1="137" x2="165" y2="157" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="155" y1="147" x2="175" y2="147" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  </g>
</svg>
