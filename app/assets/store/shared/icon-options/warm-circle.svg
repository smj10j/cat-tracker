<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Concept 3: Concentric warm rings with cat silhouette -->
  <rect width="1024" height="1024" rx="224" fill="#1B1424"/>
  <!-- Outer ring -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="#F2A65A" stroke-width="12" opacity="0.2"/>
  <!-- Inner ring -->
  <circle cx="512" cy="512" r="240" fill="none" stroke="#F2A65A" stroke-width="16" opacity="0.35"/>
  <!-- Data arc (partial ring — suggests trending) -->
  <path d="M512 272 A240 240 0 1 1 320 660" fill="none" stroke="#F2A65A" stroke-width="16" stroke-linecap="round" opacity="0.7"/>
  <!-- Cat head silhouette at center -->
  <circle cx="512" cy="520" r="80" fill="#F5EDE0"/>
  <!-- Ears -->
  <path d="M452 460 L432 380 L480 440Z" fill="#F5EDE0"/>
  <path d="M572 460 L592 380 L544 440Z" fill="#F5EDE0"/>
  <!-- Inner ears -->
  <path d="M458 456 L446 400 L476 442Z" fill="#F2A65A"/>
  <path d="M566 456 L578 400 L548 442Z" fill="#F2A65A"/>
  <!-- Eyes -->
  <circle cx="484" cy="510" r="12" fill="#1B1424"/>
  <circle cx="540" cy="510" r="12" fill="#1B1424"/>
  <!-- Nose -->
  <path d="M512 540 L504 532 L520 532Z" fill="#C8741F"/>
</svg>
